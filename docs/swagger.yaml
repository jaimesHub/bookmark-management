definitions:
  handler.ShortenRequest:
    properties:
      exp:
        minimum: 1
        type: integer
      url:
        type: string
    required:
    - exp
    - url
    type: object
  service.Response:
    properties:
      hostname:
        type: string
      instance_id:
        type: string
      message:
        type: string
      service_name:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API for managing bookmarks
  title: Bookmark Management API
  version: "1.0"
paths:
  /health-check:
    get:
      description: Returns service health status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.Response'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Check health
      tags:
      - health
  /v1/links/redirect/{code}:
    get:
      description: Looks up the shortened code in storage and issues an HTTP 302 redirect
        to the original URL.
      parameters:
      - description: Shortened code
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Found
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Redirect to original URL
      tags:
      - links
  /v1/links/shorten:
    post:
      consumes:
      - application/json
      description: Generates a 7-character alphanumeric code for the given URL and
        stores it in Redis with the specified TTL
      parameters:
      - description: Shorten URL request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ShortenRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Shorten a URL
      tags:
      - links
swagger: "2.0"
