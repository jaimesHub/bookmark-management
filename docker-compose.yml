services:
  redis:
    image: redis:alpine
    container_name: bookmark-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bookmark-api:latest
    container_name: bookmark-api
    ports:
      # host:container — HOST_PORT (machine-side, used by curl/browser),
      # API_CONTAINER_PORT (container-side, where the app listens).
      # Both default to 8080 when .env is missing the values.
      - "${HOST_PORT:-8080}:${API_CONTAINER_PORT:-8080}"
    env_file:
      - .env
    environment:
      # Override REDIS_ADDR: service-name resolution inside compose network.
      # This always overrides whatever is in .env (.env's REDIS_ADDR applies
      # only when running the app container standalone, not via compose).
      - REDIS_ADDR=redis:6379
    depends_on:
      redis:
        condition: service_healthy
    # Healthcheck lives here (not in Dockerfile) so the port can be configured
    # via .env without rebuilding the image. wget is built into alpine (busybox).
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${API_CONTAINER_PORT:-8080}/health-check"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
