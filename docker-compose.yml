services:
  redis:
    image: redis:alpine
    container_name: bookmark-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bookmark-api:latest
    container_name: bookmark-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Override REDIS_ADDR: service-name resolution inside compose network.
      # This always overrides whatever is in .env (.env's REDIS_ADDR applies
      # only when running the app container standalone, not via compose).
      - REDIS_ADDR=redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
