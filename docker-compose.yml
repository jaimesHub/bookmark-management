services:
  redis:
    image: redis:alpine
    container_name: bookmark-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: bookmark-postgres
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-bookmark}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_DB: ${DB_NAME:-bookmark}
    volumes:
      - bookmark-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bookmark} -d ${DB_NAME:-bookmark}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bookmark-api:latest
    container_name: bookmark-api
    # ports:
    #   # host:container — HOST_PORT (machine-side, used by curl/browser),
    #   # API_CONTAINER_PORT (container-side, where the app listens).
    #   # Both default to 8080 when .env is missing the values.
    #   - "${HOST_PORT:-8080}:${API_CONTAINER_PORT:-8080}"
    env_file:
      - .env
    environment:
      # Override REDIS_ADDR: service-name resolution inside compose network.
      # This always overrides whatever is in .env (.env's REDIS_ADDR applies
      # only when running the app container standalone, not via compose).
      - REDIS_ADDR=redis:6379
      - DB_HOST=postgres
      - DB_PORT=5432
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # Healthcheck lives here (not in Dockerfile) so the port can be configured
    # via .env without rebuilding the image. wget is built into alpine (busybox).
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:${API_CONTAINER_PORT:-8080}/health-check" ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  portal:
    image: ebvn/bookmark-app-portal:${PORTAL_VERSION:-mono}
    container_name: bookmark-portal
    restart: unless-stopped
    # expose:
    #   - "3000" # Network isolation: nginx proxy → portal:3000
    # ports:
    #   - "3000:3000" # Host access for development; in production, nginx proxy → portal:3000
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      # SolidStart SSR — bất kỳ path nào cũng trả 200 HTML (SPA catch-all)
      test: [ "CMD-SHELL", 'node -e "require(''http'').get(''http://127.0.0.1:3000/'', r => process.exit(r.statusCode===200?0:1)).on(''error'', () => process.exit(1))"' ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s # Node SSR cold-start
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 128M # Idle 66MiB, headroom 2x
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: bookmark-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
      portal:
        condition: service_healthy
    restart: unless-stopped

volumes:
  bookmark-pgdata:
    driver: local
