events {
    worker_connections 1024;
}

http {
    upstream api {
        server app:8080;
    }

    upstream frontend {
        server portal:3000;
    }

    server {
        listen 80;
        server_name localhost;

        # API routes
        location /v1/ {
            proxy_pass http://api;
        }

        location /health-check {
            proxy_pass http://api;
        }

        location /swagger/ {
            proxy_pass http://api;
        }

        # Client calls /api/* → forward to /v1/*
        location /api/bookmark_service/v1/ {
            rewrite ^/api/bookmark_service/v1/(.*)$ /v1/$1 break;
            proxy_pass http://api;
        }

        # Frontend (SPA) — serve via nginx, so /api/* same-origin requests go through nginx
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}